legal_review_note: >-
  Rule content pending professional legal review as of 2026-07-18. This is a
  compliance-readiness engineering artefact, not legal advice. These rules cover
  high-risk PROVIDER obligations plus in-force actor/deployer duties. The Digital
  Omnibus on AI is now FINAL (EP 16 Jun 2026, Council 29 Jun 2026, in force Jul 2026):
  Annex III stand-alone high-risk CONFIRMED to enforce 2 Dec 2027 (Annex I embedded:
  2 Aug 2028). Art. 50 transparency unchanged at 2 Aug 2026 (imminent); Art. 50(2)
  machine-readable marking for legacy systems from 2 Dec 2026. The Omnibus adds a new
  Art. 5 prohibition on AI-generated NCII/CSAM ("nudifiers") from 2 Dec 2026. Dates are
  no longer provisional but remain secondary-sourced pending professional review.
changelog:
  - version: "2.0.0"
    date: "2026-07-18"
    summary: >-
      Digital Omnibus on AI final adoption. Annex III stand-alone high-risk (Arts 9-15,
      17, 43, 49, 72) enforcement CONFIRMED at 2 Dec 2027 (provisional_pending_amendment
      -> phased_confirmed); Annex I embedded high-risk 2 Aug 2028. Added
      EUAI-ART5-PROHIBITED-002 (AI-generated NCII/CSAM, 2 Dec 2026) and
      EUAI-ART50-LEGACY-MARKING-001 (Art. 50(2) legacy machine-readable marking,
      2 Dec 2026). Art. 50 transparency flagged imminent (2 Aug 2026, unchanged).
      Deployer/authrep/FRIA/incident duties (Arts 22, 26, 27, 73) added under Task 2.
      Citation corrections: QMS -> Art. 17; logging -> Arts 12/18/19/20.
