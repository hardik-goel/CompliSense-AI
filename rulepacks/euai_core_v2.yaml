legal_review_status: "pending"
legal_review_note: >-
  Rule content pending professional legal review as of 2026-07-18. This is a
  compliance-readiness engineering artefact, not legal advice. These rules cover
  high-risk PROVIDER obligations (EU AI Act Chapter III). The Digital Omnibus on AI is
  now FINAL (European Parliament 16 Jun 2026, Council 29 Jun 2026, in force Jul 2026):
  Annex III stand-alone high-risk obligations are CONFIRMED to enforce on 2 Dec 2027
  (Annex I embedded high-risk: 2 Aug 2028). Dates are no longer provisional but remain
  secondary-sourced pending professional review. A startup merely USING third-party AI
  is a deployer, not a provider.
changelog:
  - version: "2.0.0"
    date: "2026-07-18"
    summary: >-
      Digital Omnibus on AI final adoption (EP 16 Jun 2026, Council 29 Jun 2026, in
      force Jul 2026). Annex III stand-alone high-risk (Arts 9-15, 17, 43, 49, 72)
      enforcement CONFIRMED at 2 Dec 2027 (date_status provisional_pending_amendment ->
      phased_confirmed). Annex I embedded high-risk enforcement set to 2 Aug 2028.
      Article 50 transparency unchanged at 2 Aug 2026 (imminent). Citation corrections:
      QMS is Art. 17 (not 16); logging/record-keeping realigned to Arts 12/18/19/20.
    superseded_pack: "euai_core_v1"
