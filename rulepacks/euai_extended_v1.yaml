  # ── LIVE-now EU AI Act obligations (extended pack only) ──────────────────────
  # These are enforceable TODAY (unlike the high-risk provider duties above, which the
  # Digital Omnibus defers to ~Dec 2027). Role-gated so a startup only sees what binds it.

  - id: EUAI-ART5-PROHIBITED-001
    clause: "Art.5"
