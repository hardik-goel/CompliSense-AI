legal_review_status: "pending"
legal_review_note: >-
  Rule content pending professional legal review as of 2026-06-26. This is a
  compliance-readiness engineering artefact, not legal advice. These rules cover
  high-risk PROVIDER obligations (EU AI Act Chapter III). The application date is a
  MOVING TARGET: the Digital Omnibus (political agreement 7 May 2026, pending formal
  adoption) defers Annex III high-risk from 2 Aug 2026 to ~2 Dec 2027. Dates here are
  provisional. A startup merely USING third-party AI is a deployer, not a provider.
reviewer: null
reviewed_on: null
required_artifacts_manifest: "agent/artefacts/required_artifacts_euai.yaml"
rules:
  - id: EUAI-ART9-RISK-MGMT-001
    clause: "Art.9"
    title: "Risk management system documented and maintained"
    act_citation: "Regulation (EU) 2024/1689 (EU AI Act), Art. 9 (risk management system)"
    rule_citation: null
    source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    applicability:
      scope: "eu_provider"
      threshold: "Applies to providers of high-risk AI systems (Art. 6 + Annex III). Deployers of third-party AI have lighter duties (Art. 26-27)."
      exemption_ref: "Open-source AI systems exempt (Art. 2) unless prohibited or high-risk."
    status: "phased_not_yet_in_force"
    enforcement_date: "2027-12-02"
    date_status: "provisional_pending_amendment"
    amending_instrument: "Digital Omnibus simplification (political agreement 7 May 2026, pending formal adoption) — defers Annex III high-risk from 2 Aug 2026 to ~2 Dec 2027."
    date_verified_on: "2026-06-26"
    verification: "secondary_source_only"
    evaluator: "schema_validate"
    inputs:
      file: "compliance/risk_register.yaml"
      schema_file: "schemas/risk_register.schema.json"
      coverage_min: 0.9
    expression: "(schema_valid and coverage >= coverage_min) or (exists and coverage >= 0.5)"
    thresholds:
      pass: 0.9
      partial: 0.5
    severity: "Major"
    evidence:
      collect: ["file_hash", "schema_validation_report"]
    sla:
      warn_ms: 300
      fail_ms: 1000

