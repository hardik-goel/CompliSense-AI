    act_citation: "Regulation (EU) 2024/1689 (EU AI Act), Art. 5 (prohibited AI practices)"
    rule_citation: null
    source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    applicability:
      scope: "all_ai_actors"
      threshold: "Art. 5 bans (social scoring, untargeted facial scraping, workplace/education emotion recognition, certain biometric categorisation, manipulative techniques) apply to all actors placing/using AI affecting the EU."
      exemption_ref: null
    status: "in_force"
    enforcement_date: "2025-02-02"
    date_status: "in_force"
    date_verified_on: "2026-06-26"
    verification: "secondary_source_only"
    evaluator: "file_presence"
    inputs:
      file: "compliance/prohibited_practices_assessment.yaml"
      required_json_fields:
        - "assessed_practices"
        - "uses_prohibited_practice"
        - "justification"
        - "reviewer"
    expression: "exists and missing_fields <= 1"
    thresholds:
      pass: 0.0
      partial: 1.0
    severity: "Critical"

