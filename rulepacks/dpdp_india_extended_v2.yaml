legal_review_note: >-
  Rule content pending professional legal review as of 2026-07-18. This is a
  compliance-readiness engineering artefact, not legal advice. DPDP operational
  obligations (Rules 3, 5-16) become enforceable ~13 May 2027 — findings are
  "prepare by" items, not present-day violations.
# Areas deliberately NOT assessed by default, so an omission reads as a decision, not a
# miss. Surfaced in the readiness report as "Out of scope for your profile".
scope_exclusions:
  - id: consent_manager_first_schedule
    label: "Consent Manager obligations (DPDP Rules 2025, Rule 4 + First Schedule)"
    note: >-
      Applies only to entities registered as Consent Managers; excluded from the
      default assessment. Add a dedicated Consent Manager pack on demand.
changelog:
  - version: "2.0.0"
    date: "2026-07-18"
    summary: >-
      Added DPDP-SEC14-NOMINATION-001 (right to nominate, Act s.14) and
      DPDP-SEC9-GUARDIAN-001 (consent via lawful guardian for persons with
      disabilities, s.9 proviso + DPDP Rules 2025 guardian-verification). Verified the
      Third-Schedule class-based retention split (DPDP-SEC8-RETENTION-CLASS-001 remains
      gated to third_schedule_class_only). v1 kept registered for reproducibility.
    superseded_pack: "dpdp_india_extended_v1"
  - version: "2.1.0"
    date: "2026-07-18"
    summary: >-
      DPDP gap-fill refinement. SEC14 nomination now checks a nomination section
      (nomination_capture_method / nominee_record / activation_trigger / honour_process).
      SEC9-GUARDIAN re-gated to the new `disability_guardian_only` scope (manifest fact
      `handles_disability_guardian_data`, which also fires on children's data) against a
      dedicated guardian_consent_policy.yaml artefact. Added scope_exclusions
      (consent_manager_first_schedule). SEC6-CONSENT carries a review_action for
      primary-text verification.
