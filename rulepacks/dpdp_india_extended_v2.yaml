  - id: DPDP-SEC9-GUARDIAN-001
    clause: "Section 9 proviso"
    title: "Consent via lawful guardian for persons with disabilities is documented"
    act_citation: "DPDP Act 2023, s.9 proviso (Data Fiduciary must obtain verifiable consent of the lawful guardian of a Data Principal who is a person with disability)"
    rule_citation: "DPDP Rules 2025, Rule 10 (verifiable consent / guardian-verification mechanics)"
    source_url: "https://dpdpa.com/DPDP_Rules_2025_English_only.pdf"
    applicability:
      # Sibling to DPDP-SEC9-CHILDREN-001: shares the guardian-verification machinery,
      # but fires independently. Applicable when the entity processes children's data OR
      # personal data of persons with disability who act through a lawful guardian —
      # captured by the manifest `handles_disability_guardian_data` fact (which is set true
      # when either children's data or disability/guardian data is handled).
      scope: "disability_guardian_only"
      threshold: "Applies where the Data Fiduciary processes personal data of persons with disability who have a lawful guardian (s.9 proviso), or children's data (same Rule 10 machinery)."
      exemption_ref: "Fourth Schedule exemptions (Rule 12)."
    status: "phased_not_yet_in_force"
    enforcement_date: "2027-05-13"
    date_status: "phased_confirmed"
    verification: "secondary_source_only"
    secondary_source_only: true
    legal_review_status: "pending"
    interpretation_uncertain: true
    evaluator: "file_presence"
    inputs:
      file: "compliance/guardian_consent_policy.yaml"
      required_json_fields:
        - "guardian_verification_method"
        - "disability_scope_notes"
        - "consent_capture"
        - "withdrawal_by_guardian"
    expression: "exists and missing_fields <= 1"
    thresholds:
      pass: 0.0
      partial: 1.0
    severity: "Major"

