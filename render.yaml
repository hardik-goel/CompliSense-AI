services:
  - type: web
    name: complisense-ai-backend
    env: python
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "10000"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: complisense
      - key: MARKETING_SITE_URL
        value: https://complisenseai.com
      - key: APP_BASE_URL
        value: https://complisense-ai-backend.onrender.com
      - key: API_BASE_URL
        value: https://api.complisenseai.com
      - key: COOKIE_DOMAIN
        value: .complisenseai.com
      - key: SUPPORT_EMAIL
        value: support@complisenseai.com
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: SECURE_COOKIES
        value: "true"

  # Phase 2.4: scheduled-monitoring sweep. Raises scan-overdue alerts for projects
  # whose re-scan cadence has lapsed (regression alerts are raised inline at ingestion).
  - type: cron
    name: complisense-monitoring-sweep
    env: python
    plan: free
    schedule: "0 6 * * *"  # daily 06:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python -m saas.app.monitoring_cron
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: complisense
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO

  # Phase 5.4: regulatory-change watcher. Fetches the legal sources our rulepacks cite and
  # raises a human-gated review item on any change. Detection only — never edits rulepacks.
  - type: cron
    name: complisense-regwatch-sweep
    env: python
    plan: free
    schedule: "0 5 * * 1"  # weekly, Monday 05:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python -m saas.app.regwatch_cron
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: complisense
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
